# =============================================================================
# 공통 설정값 (과제 기준 임계값, XAI·공정성·통계 모듈 설정)
# 환경마다 달라지는 값(포트, 서비스 주소, 경로)은 .env / 환경 변수로 관리한다 → src/config.py
#
# 세부 설정은 파일별로 한 곳에서만 관리한다 (값을 여기에 중복해서 적지 않는다):
#   data.yaml          GMSC 정제 규칙 (특수코드, 사용률 기준, 최소 연령)           → src/data/preprocessor.py
#   simulator.yaml     대안 변수 8개, thin_filer_ratio / bias_ratio, 씬파일러 규칙  → src/data/simulator.py
#   actionability.yaml 변수별 조치 가능성, 단조 제약, 모델 변수 여부                → src/data/features.py
#   train.yaml         분할 70:15:15 (stratify=y), 5 × 5겹 CV, 알고리즘·불균형 처리,
#                      하이퍼파라미터, 모델 버전, MLflow 실험                        → src/models/train.py
#   scoring.yaml       PD → 점수(0~1000) → 등급 A~E → 승인 (점수 475 이상)        → src/models/scoring.py
#   german.yaml        German Credit 보조 모델                                    → src/models/german.py
# =============================================================================

project:
  name: XAI 기반 대안신용평가 시스템
  disclaimer: 본 시스템은 교육 목적으로 개발되었으며, 실제 금융 의사결정에 사용할 수 없습니다.
  random_seed: 42

performance_targets:
  auc_roc_min: 0.78
  ks_statistic_min: 0.28
  thin_filer_auc_uplift_min: 0.03
  psi_max: 0.10
  predict_latency_sec_max: 2.0
  recourse_coverage_min: 0.90          # 헌장: 거절자 중 승인 경로(DiCE)가 있는 비율

explainer:
  summary_top_features: 15
  dependence_plot_min_features: 2
  # Dependence Plot 변수 (python -m src.explainer.global_shap). 조치 가능 변수 1위, 전통 신용 변수,
  # 보호 속성(공정성 보고서와 연결), 단조 제약 연체 변수
  dependence_features:
    - spending_consistency
    - RevolvingUtilizationOfUnsecuredLines
    - age
    - NumberOfTimes90DaysLate
  # 개별 고객 Waterfall Plot 의 줄 수: 영향이 큰 변수 9개 + 나머지를 묶은 1줄 (python -m src.explainer.waterfall)
  waterfall_max_display: 10
  rejection_reasons_top_k: 5
  rejection_reasons_min: 3
  rejection_reason_min_contribution: 0.01   # |기여도| 가 이보다 작은 변수는 거절 사유에서 뺀다 (log-odds)
  # 거절 사유에서 조언이 아니라 '[참고(변경 불가)]' 로만 표시할 조치 가능성 분류
  # (configs/actionability.yaml: 권장 불가, 불변, 감소 불가)
  reference_only_classes: [NOT_RECOMMENDED, IMMUTABLE, NON_DECREASING]
  # 거절 사유 문장의 값 표시 (kind: pct | count | money | decimal | flag). 비교 기준은 배포 모델의
  # 학습 데이터 중앙값 (파이프라인 imputer 의 statistics_)
  value_format:
    RevolvingUtilizationOfUnsecuredLines: {kind: pct}
    age: {kind: count, unit: 세}
    NumberOfTime30-59DaysPastDueNotWorse: {kind: count, unit: 회}
    DebtRatio: {kind: pct}
    MonthlyIncome: {kind: money}
    NumberOfOpenCreditLinesAndLoans: {kind: count, unit: 개}
    NumberOfTimes90DaysLate: {kind: count, unit: 회}
    NumberRealEstateLoansOrLines: {kind: count, unit: 건}
    NumberOfTime60-89DaysPastDueNotWorse: {kind: count, unit: 회}
    NumberOfDependents: {kind: count, unit: 명}
    pastdue_special_code: {kind: flag}
    income_missing: {kind: flag}
    income_zero: {kind: flag}
    util_outlier: {kind: flag}
    telecom_payment_rate: {kind: pct}
    utility_payment_rate: {kind: pct}
    telecom_tenure_months: {kind: count, unit: 개월}
    insurance_paid_months: {kind: count, unit: 개월}
    spending_consistency: {kind: decimal, unit: 점}
    regular_payment_count: {kind: count, unit: 건}
    app_login_frequency: {kind: count, unit: 회}
  # DiCE 승인 경로 (python -m src.explainer.recourse). 바꿀 변수, 방향, 단위, 범위, 단계당 개월, 난이도는
  # configs/actionability.yaml (dice_vary: true), 목표 점수는 configs/scoring.yaml (recourse_target_score)
  recourse:
    horizons_months: [6, 9, 12, 18, 24]
    max_changed_features: 3
    # DebtRatio = 월 부채 상환액 / 월 소득. 소득이 오르면 부채가 그대로라는 가정으로 DebtRatio 를 다시 계산
    link_income_debt: true
    dice:
      method: genetic
      total_cfs: 5
      maxiterations: 500
      proximity_weight: 0.2
      sparsity_weight: 0.2
      diversity_weight: 5.0
    # 유전 알고리즘 초기 집단: 한 번에 init_batch 개씩, 최대 init_max_samples 개까지 무작위로 뽑는다
    init_batch: 2000
    init_max_samples: 100000
    seed: 42
    n_jobs: -1          # -1 = CPU 코어 수
    output_dir: recourse                     # reports/ 아래
    mlflow_experiment: nextstep-recourse

fairness:
  protected_attributes:
    gender: [male, female]             # 시뮬레이션 값 (configs/simulator.yaml 의 gender)
    age_band: ["20-34", "35-54", "55+"]  # configs/simulator.yaml 의 age_bands
  di_ratio_bounds: [0.8, 1.25]         # 범위를 벗어나면 WARNING 로그
  equalized_odds_max_diff: 0.10        # TPR/FPR 차이 허용 상한
  default_attribute: gender            # GET /fairness 의 기본 보호 속성 (gender | age_band)
  output: fairness/fairness_metrics.json  # python -m src.fairness 결과 (REPORTS_DIR 기준)
  # Bias Mitigation (python -m src.fairness.mitigation). 기준점은 validation 에서 고르고 test 에서 보고한다
  mitigation:
    attribute: age_band                # 완화 대상 보호 속성 (EO 기준 미달)
    # Threshold Adjustment: 집단별 승인 기준점 후보. 조건(EO, DI, 승인자 부도율 유지)을 지키는
    # 조합 중 승인율이 가장 높은 것을 고른다
    cutoff_grid: {min: 400, max: 550, step: 5}
    output: fairness/mitigation.json
    # GET /fairness/mitigation 의 '적용 후' 로 내보낼 방법 (reweighting | threshold_adjustment).
    # 두 방법의 결과는 모두 output 파일에 있다
    api_method: reweighting

statistics:
  alpha: 0.05
  eta_squared_bounds:                  # 효과 크기 해석 기준
    small: 0.01
    medium: 0.06
    large: 0.14
  # ANOVA 입력: 5 × 5 폴드 AUC (api.reports.cv_fold_auc). 검증 정의는 reports/anova_handoff_ko.md 를 따른다
  anova:
    test_1:
      name: 피처 그룹별 AUC 비교 (One-way ANOVA)
      group: features
      filter: {segment: all}
      labels: {gmsc: 전통 Only, alt: 대안 Only, both: 통합}
    # 통합 피처만 비교한다. 피처 그룹을 섞으면 그 차이(AUC 0.86~0.94)가 집단 안 변동이 되어
    # 알고리즘 차이(약 0.002)를 가린다 (reports/anova_report_ko.md 3절)
    test_2:
      name: 알고리즘별 AUC 비교, 통합 피처 (One-way ANOVA)
      group: model
      filter: {segment: all, features: both}
      labels: {lr: LogisticRegression, xgb: XGBoost, lgbm: LightGBM}
  # 보너스: 세그먼트 × 피처 구성 이원 ANOVA. 최종 설정(xgb, 리샘플링 없음)만 써서 알고리즘·리샘플링
  # 차이가 잔차에 섞이지 않게 한다. 필터의 목록 순서가 수준 순서다 (교호작용 대비 =
  # 첫 세그먼트의 피처 효과 - 둘째 세그먼트의 피처 효과). 같은 폴드의 씬파일러·일반 AUC 는
  # 같은 모델에서 나와 독립이 아니므로 pair_on 으로 짝지은 교호작용 대비 t-검정을 함께 보고한다
  two_way_anova:
    test_3:
      name: 세그먼트 × 피처 구성별 AUC 비교 (Two-way ANOVA)
      factors: [segment, features]
      filter: {model: xgb, resampling: none, segment: [thin, general], features: [gmsc, both]}
      factor_labels: {segment: 세그먼트, features: 피처 구성}
      labels: {thin: 씬파일러, general: 일반, gmsc: 전통, both: 통합}
      pair_on: [repeat, fold]

# 승인 경로의 승인 유지 확률 (python -m src.models.path_robustness). 배포 모델과 같은 설정을
# train+validation 의 일부로 여러 번 다시 학습해, 경로를 따른 고객을 몇 % 의 모델이 승인하는지 본다.
# 기간은 api.recourse_default_horizon, 경로는 reports/recourse/paths_<기간>m.csv
recourse_approval:
  models: 20              # 다시 학습할 모델 수
  sample_share: 0.8       # 모델마다 쓰는 train+validation 비율 (점검 notebooks/audit.py 와 같음)
  seed: 2026              # 표본 추출 시드 (모델 k 는 seed + k)
  score_bins: [475, 495, 500, 505, 510, 520, 540, 1000]   # 표시용 점수 구간 (경로 후 점수)

api:
  # API 가 읽는 산출물 (REPORTS_DIR 기준 상대 경로). 학습·점검 코드가 만든다
  reports:
    final_summary: final_summary.json      # src/models/train.py (configs/train.yaml outputs)
    grade_table: grade_table.csv           # src/models/train.py
    cv_fold_auc: cv_fold_auc.csv           # src/models/train.py
    fairness_metrics: fairness/fairness_metrics.json  # python -m src.fairness
    fairness_mitigation: fairness/mitigation.json     # python -m src.fairness.mitigation
    shap_global: shap_global_top10.csv     # notebooks/model_report.py
    shap_summary_plot: figures/13_shap_summary_{lang}.png  # python -m src.explainer.global_shap
    test_curves: test_curves.json          # python -m src.models.curves (test 세트 ROC / PR 곡선)
    recourse_summary: recourse/summary.json  # python -m src.explainer.recourse (test 세트 거절자, 기간별)
    recourse_approval: recourse/approval_probability.json  # python -m src.models.path_robustness
  # POST /recourse 의 기본 기간 (개월). 대시보드는 이 기간으로 고정한다. 18개월은 경로 커버리지가
  # 목표 90% 를 처음 넘는 기간이다. 고를 수 있는 기간은 explainer.recourse.horizons_months
  recourse_default_horizon: 18
  # ROC / PR 곡선에서 고를 기준점 수 (python -m src.models.curves). 예측 부도 건수를 로그 간격으로
  # 나눠 곡선이 빠르게 변하는 낮은 FPR 구간에 점을 더 둔다
  curve_points: 100

dashboard:
  # POST /recourse (DiCE 실시간 탐색) 요청의 응답 대기 시간 (초). 다른 요청은 10초
  recourse_timeout_seconds: 60
  # 리스크 등급별 위험도 색상 (고위험 = 빨강, 중위험 = 노랑, 저위험 = 초록)
  risk_levels:
    A: low
    B: low
    C: medium
    D: high
    E: high
