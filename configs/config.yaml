# =============================================================================
# 공통 설정값 (과제 기준 임계값, XAI·공정성·통계 모듈 설정)
# 환경마다 달라지는 값(포트, 서비스 주소, 경로)은 .env / 환경 변수로 관리한다 → src/config.py
#
# 세부 설정은 파일별로 한 곳에서만 관리한다 (값을 여기에 중복해서 적지 않는다):
#   data.yaml          GMSC 정제 규칙 (특수코드, 사용률 기준, 최소 연령)           → src/data/preprocessor.py
#   simulator.yaml     대안 변수 8개, thin_filer_ratio / bias_ratio, 씬파일러 규칙  → src/data/simulator.py
#   actionability.yaml 변수별 조치 가능성, 단조 제약, 모델 변수 여부                → src/data/features.py
#   train.yaml         분할 70:15:15 (stratify=y), 5 × 5겹 CV, 알고리즘·불균형 처리,
#                      하이퍼파라미터, 모델 버전, MLflow 실험                        → src/models/train.py
#   scoring.yaml       PD → 점수(0~1000) → 등급 A~E → 승인 (점수 475 이상)        → src/models/scoring.py
#   german.yaml        German Credit 보조 모델                                    → src/models/german.py
# =============================================================================

project:
  name: XAI 기반 대안신용평가 시스템
  disclaimer: 본 시스템은 교육 목적으로 개발되었으며, 실제 금융 의사결정에 사용할 수 없습니다.
  random_seed: 42

performance_targets:
  auc_roc_min: 0.78
  ks_statistic_min: 0.28
  thin_filer_auc_uplift_min: 0.03
  psi_max: 0.10
  predict_latency_sec_max: 2.0

explainer:
  summary_top_features: 15
  dependence_plot_min_features: 2
  rejection_reasons_top_k: 5
  rejection_reasons_min: 3
  rejection_reason_min_contribution: 0.01   # |기여도| 가 이보다 작은 변수는 거절 사유에서 뺀다 (log-odds)
  # 거절 사유 문장의 값 표시 (kind: pct | count | money | decimal | flag). 비교 기준은 배포 모델의
  # 학습 데이터 중앙값 (파이프라인 imputer 의 statistics_)
  value_format:
    RevolvingUtilizationOfUnsecuredLines: {kind: pct}
    age: {kind: count, unit: 세}
    NumberOfTime30-59DaysPastDueNotWorse: {kind: count, unit: 회}
    DebtRatio: {kind: pct}
    MonthlyIncome: {kind: money}
    NumberOfOpenCreditLinesAndLoans: {kind: count, unit: 개}
    NumberOfTimes90DaysLate: {kind: count, unit: 회}
    NumberRealEstateLoansOrLines: {kind: count, unit: 건}
    NumberOfTime60-89DaysPastDueNotWorse: {kind: count, unit: 회}
    NumberOfDependents: {kind: count, unit: 명}
    pastdue_special_code: {kind: flag}
    income_missing: {kind: flag}
    income_zero: {kind: flag}
    util_outlier: {kind: flag}
    telecom_payment_rate: {kind: pct}
    utility_payment_rate: {kind: pct}
    telecom_tenure_months: {kind: count, unit: 개월}
    insurance_paid_months: {kind: count, unit: 개월}
    spending_consistency: {kind: decimal, unit: 점}
    regular_payment_count: {kind: count, unit: 건}
    app_login_frequency: {kind: count, unit: 회}

fairness:
  protected_attributes:
    gender: [male, female]             # 시뮬레이션 값 (configs/simulator.yaml 의 gender)
    age_group: ["20-34", "35-54", "55+"]
  di_ratio_bounds: [0.8, 1.25]         # 범위를 벗어나면 WARNING 로그
  equalized_odds_max_diff: 0.10        # TPR/FPR 차이 허용 상한
  default_attribute: gender            # GET /fairness 의 기본 보호 속성 (gender | age_band)

statistics:
  alpha: 0.05
  eta_squared_bounds:                  # 효과 크기 해석 기준
    small: 0.01
    medium: 0.06
    large: 0.14
  # ANOVA 입력: 5 × 5 폴드 AUC (api.reports.cv_fold_auc). 검증 정의는 reports/anova_handoff_ko.md 를 따른다
  anova:
    test_1:
      name: 피처 그룹별 AUC 비교 (One-way ANOVA)
      group: features
      filter: {segment: all}
      labels: {gmsc: 전통 Only, alt: 대안 Only, both: 통합}
    test_2:
      name: 알고리즘별 AUC 비교 (One-way ANOVA)
      group: model
      filter: {segment: all}
      labels: {lr: LogisticRegression, xgb: XGBoost, lgbm: LightGBM}

api:
  # API 가 읽는 산출물 (REPORTS_DIR 기준 상대 경로). 학습·점검 코드가 만든다
  reports:
    final_summary: final_summary.json      # src/models/train.py (configs/train.yaml outputs)
    grade_table: grade_table.csv           # src/models/train.py
    cv_fold_auc: cv_fold_auc.csv           # src/models/train.py
    fairness_audit: audit/2_fairness.json  # notebooks/audit.py
    shap_global: shap_global_top10.csv     # notebooks/model_report.py
  curve_points: 50                         # ROC / PR 곡선 좌표 수

dashboard:
  # 리스크 등급별 위험도 색상 (고위험 = 빨강, 중위험 = 노랑, 저위험 = 초록)
  risk_levels:
    A: low
    B: low
    C: medium
    D: high
    E: high
