# =============================================================================
# XAI 대안신용평가 시스템 - 통합 실행 설정
#
#   docker compose up --build                 → mlflow(5000) + api(8000) + dashboard(8501)
#   docker compose --profile dev up -d dev    → + dev(JupyterLab 8888, 학습·테스트용)
#   docker compose --profile dev run --rm dev python -m src.models.train --stage all
#                                             → 모델 학습 + mlflow 서버에 실험 기록
#   docker compose watch                      → src/ 변경 시 api·dashboard 자동 반영
#
# 호스트 포트 등 설정값은 .env 로 덮어쓸 수 있다 (.env.example 참고, 없으면 기본값 사용).
# 포트는 기본으로 이 PC 에서만 열린다 (IPv4 127.0.0.1 + IPv6 ::1). Windows 의 localhost 는 ::1 을
# 먼저 시도하므로 IPv4 만 열면 요청마다 약 2초가 늦어진다. MLflow 는 인증이 없으므로, 같은 네트워크의
# 다른 기기에서 시연할 때만 BIND_ADDRESS=0.0.0.0, BIND_ADDRESS_V6=:: 로 바꾼다.
# =============================================================================
name: xai-credit

x-build-args: &build-args
  PYTHON_VERSION: ${PYTHON_VERSION:-3.12}

x-common-env: &common-env
  APP_ENV: docker
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  MLFLOW_TRACKING_URI: http://mlflow:5000   # 실험 이름은 configs/train.yaml (mlflow.experiments)
  MODEL_NAME: ${MODEL_NAME:-xgboost}
  MODEL_VERSION: ${MODEL_VERSION:-v1.0}

services:
  # ---------------------------------------------------------------------------
  # MLflow Tracking Server: 실험 메타데이터(SQLite) + 아티팩트를 ./mlflow_data 에 저장
  # 아티팩트는 서버가 프록시(--serve-artifacts)하므로 호스트/컨테이너 어디서 학습해도 동일하게 기록된다
  # ---------------------------------------------------------------------------
  mlflow:
    build:
      context: .
      target: mlflow
      args: *build-args
    image: xai-credit/mlflow:latest
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MLFLOW_PORT:-5000}:5000"
      - "[${BIND_ADDRESS_V6:-::1}]:${MLFLOW_PORT:-5000}:5000"
    environment:
      # MLflow 3 기본값(웹 워커 4개 + GenAI 작업 실행 프로세스 6개)은 쉬고 있을 때도 약 2.2GB 를 쓴다.
      # 이 프로젝트는 작업 실행 기능을 쓰지 않고 요청도 적으므로 워커 1개, 작업 실행 끔 (약 350MB).
      # SQLite 저장소를 여러 워커가 함께 쓸 때의 "database is locked" 위험도 줄어든다.
      MLFLOW_WORKERS: ${MLFLOW_WORKERS:-1}
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: ${MLFLOW_SERVER_ENABLE_JOB_EXECUTION:-false}
    volumes:
      - ./mlflow_data:/mlflow
      - ./mlflow_seed:/seed:ro   # copied into an empty ./mlflow_data on first start (see Dockerfile)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # FastAPI: 신용평가·XAI·공정성·통계 API (Swagger UI: /docs)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      target: api
      args: *build-args
    image: xai-credit/api:latest
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
      - "[${BIND_ADDRESS_V6:-::1}]:${API_PORT:-8000}:8000"
    environment:
      <<: *common-env
      TQDM_DISABLE: "1"   # DiCE(/recourse) 가 요청마다 찍는 진행 막대를 로그에서 뺀다
    volumes:
      - ./models:/app/models:ro
      - ./reports:/app/reports:ro
    # MLflow 에 의존하지 않는다: 모델은 models/ 파일에서, 지표는 reports/ 에서 읽는다
    # (docker compose up api 만 실행해도 mlflow 서비스를 띄우지 않는다)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /app/src
        - action: sync+restart
          path: ./configs
          target: /app/configs
        - action: rebuild
          path: ./requirements.txt

  # ---------------------------------------------------------------------------
  # Streamlit 대시보드: 모델을 직접 로드하지 않고 API_URL 로만 통신 (MSA)
  # ---------------------------------------------------------------------------
  dashboard:
    build:
      context: .
      target: dashboard
      args: *build-args
    image: xai-credit/dashboard:latest
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${DASHBOARD_PORT:-8501}:8501"
      - "[${BIND_ADDRESS_V6:-::1}]:${DASHBOARD_PORT:-8501}:8501"
    environment:
      APP_ENV: docker
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /app/src
        - action: sync+restart
          path: ./configs
          target: /app/configs
        - action: rebuild
          path: ./requirements-dashboard.txt

  # ---------------------------------------------------------------------------
  # 개발 환경 (profile: dev) - EDA, 모델 학습, pytest 실행용
  # 레포 전체를 /app 에 마운트하므로 컨테이너 안에서 만든 파일이 호스트에 그대로 남는다
  # ---------------------------------------------------------------------------
  dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
      args: *build-args
    image: xai-credit/dev:latest
    ports:
      - "127.0.0.1:${JUPYTER_PORT:-8888}:8888"   # 항상 이 PC 에서만 (BIND_ADDRESS 와 무관)
      - "[::1]:${JUPYTER_PORT:-8888}:8888"
    environment:
      <<: *common-env
      APP_ENV: dev
      API_URL: http://api:8000
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-xai-dev}
      REQUIRE_DATA: ${REQUIRE_DATA:-0}
      KAGGLE_USERNAME: ${KAGGLE_USERNAME:-}
      KAGGLE_KEY: ${KAGGLE_KEY:-}
    volumes:
      - .:/app
    depends_on:
      mlflow:
        condition: service_healthy
